[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veery"
version = "0.1.0"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "tqdm",
]
requires-python = ">=3.12"
authors = [
    {name = "Nataly Panczyk", email = "nrpanczyk@gmail.com"}
]
maintainers = [
    {name = "Nataly Panczyk", email = "nrpanczyk@gmail.com"}
]
description = "A Validation Environment for Exposing RiskY models"
readme = "README.md"
license = "MIT"

[project.urls]
Repository = "https://github.com/npanczyk/2026-panczyk-rlval"

[project.optional-dependencies]
dev = ["pytest"]
experiments = ["stable-baselines3[extra]", "tensorboard", "gymnasium==1.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["experiments"]